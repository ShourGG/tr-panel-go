<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>泰拉瑞亚服务器管理面板 v2.0</title>
    
    <style>
      /* 使用系统字体 */
      * {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      }
      
      /* 预加载背景 */
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom right, #f0f9ff, #e0f2fe, #f0f9ff);
      }
      
      /* H形状预加载动画 */
      .app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom right, #f0f9ff, #e0f2fe, #f0f9ff);
        z-index: 9999;
      }
      
      .loader-container {
        display: flex;
        gap: 10px;
      }
      
      .loader-bar {
        width: 8px;
        height: 50px;
        background: linear-gradient(180deg, #3b82f6, #8b5cf6);
        border-radius: 4px;
        animation: pulse 1.4s ease-in-out infinite;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }
      
      .loader-bar:nth-child(1) {
        animation-delay: 0s;
      }
      
      .loader-bar:nth-child(2) {
        height: 25px;
        align-self: center;
        animation-delay: 0.2s;
      }
      
      .loader-bar:nth-child(3) {
        animation-delay: 0.4s;
      }
      
      @keyframes pulse {
        0%, 100% {
          opacity: 0.4;
          transform: scaleY(0.85);
        }
        50% {
          opacity: 1;
          transform: scaleY(1);
        }
      }
      
      /* 深色模式下的预加载 */
      html.dark .app-loader {
        background: linear-gradient(to bottom right, #0f172a, #1e293b, #0f172a);
      }
      
      html.dark body {
        background: linear-gradient(to bottom right, #0f172a, #1e293b, #0f172a);
      }
      
      /* 加载完成后隐藏 */
      .app-loader.loaded {
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
    </style>
    
    <script>
      // 立即应用保存的主题，避免闪烁
      (function() {
        const savedTheme = localStorage.getItem('terraria-panel-theme')
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-BWwuKvHx.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/vue-vendor-C-hk4M4e.js">
    <link rel="modulepreload" crossorigin href="/assets/axios-ei4kQ0Q2.js">
    <link rel="modulepreload" crossorigin href="/assets/monaco-editor-D8wUSeaA.js">
    <link rel="stylesheet" crossorigin href="/assets/index-NXhCur-2.css">
  </head>
  <body>
    <!-- H形状预加载动画 -->
    <div class="app-loader" id="appLoader">
      <div class="loader-container">
        <div class="loader-bar"></div>
        <div class="loader-bar"></div>
        <div class="loader-bar"></div>
      </div>
    </div>
    
    <div id="app"></div>
  </body>
</html>
